name: Data Ingestion

on:
  schedule:
    # Every 30 minutes at :03/:33 UTC (= 09:03/09:33 JST offset).
    - cron: "3,33 * * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Maximum due jobs to run in this tick"
        required: false
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: data-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.CODIP_INGESTION_DATABASE_URL }}
      CODIP_INGESTION_MAX_JOBS_PER_TICK: ${{ github.event.inputs.max_jobs || '3' }}
      CODIP_INGESTION_TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL Prisma client
        run: npm run db:pg:generate

      - name: Run due ingestion jobs
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing secrets.CODIP_INGESTION_DATABASE_URL"
            exit 1
          fi
          node scripts/ingestion/run-due-jobs.js

      - name: Data quality monitoring summary
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing secrets.CODIP_INGESTION_DATABASE_URL"
            exit 1
          fi
          node scripts/ingestion/quality-monitor.js
