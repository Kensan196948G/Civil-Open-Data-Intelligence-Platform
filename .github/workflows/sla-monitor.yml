name: Data Quality SLA Monitor

on:
  schedule:
    # 21:05 JST 日次（12:05 UTC）
    - cron: "5 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sla-monitor
  cancel-in-progress: false

jobs:
  sla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ダイジェストIssueの作成・更新とラベル作成に必要な最小権限。
    # permissions を明示すると未列挙の権限は none になるため、
    # 失敗通知が run 履歴を読めるよう actions:read も併せて宣言する。
    # workflow レベルの permissions は job 側で上書きされるため、
    # ここで宣言しないと issues:write が付与されず
    # POST /repos/{owner}/{repo}/labels が 403 で失敗する。
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      # 本番Neon（読み取りのみ）。値はActions Secretから供給されログへ出さない。
      DATABASE_URL: ${{ secrets.CODIP_INGESTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SLA freshness monitor (strict)
        id: sla
        continue-on-error: true
        shell: bash
        run: |
          npm run ops:sla-monitor -- --strict > sla-report.md 2>&1

      - name: Run watchlist notification check
        id: notifications
        continue-on-error: true
        shell: bash
        run: |
          npm run ops:notification-check -- --json > notifications.json 2>&1 || true
          test -s notifications.json || echo '{"checkedAt":"","digest":[]}' > notifications.json

      - name: Upload SLA report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sla-report
          path: sla-report.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish / update the data-watch digest issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const label = "data-watch-digest";

            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            };
            await ensureLabel(label, "d4c5f9", "日次データ品質ダイジェスト（自動更新）");

            const slaFailed = "${{ steps.sla.outcome }}" === "failure";
            let notificationLines = [];
            try {
              const payload = JSON.parse(fs.readFileSync("notifications.json", "utf8"));
              for (const user of payload.digest || []) {
                for (const item of user.notifications) {
                  notificationLines.push(
                    `- [${item.kind}:${item.state}] ${item.targetId} — ${item.reason}（対象: ${user.userEmail}）`,
                  );
                }
              }
            } catch {
              notificationLines = ["通知チェックの出力を読み取れませんでした。"];
            }

            const body = [
              "# データ品質ダイジェスト（自動生成）",
              "",
              `- 生成日時 (UTC): ${new Date().toISOString()}`,
              `- SLA監視: ${slaFailed ? "⚠️ 停滞ジョブあり（strict失敗）" : "✅ 全ジョブ鮮度OK"}`,
              `- ウォッチ通知: ${notificationLines.length}件`,
              "",
              "## ウォッチ通知",
              "",
              ...(notificationLines.length ? notificationLines : ["通知はありません。"]),
              "",
              "> 詳細は Actions run の `sla-report` artifact を参照。このIssueは日次で本文を更新します。",
            ].join("\n");

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            if (openIssues.length > 0) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: openIssues[0].number,
                title: `データ品質ダイジェスト ${new Date().toISOString().slice(0, 10)}`,
                body,
              });
              core.notice(`Updated data-watch digest #${openIssues[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: `データ品質ダイジェスト ${new Date().toISOString().slice(0, 10)}`,
                labels: [label],
                body,
              });
              core.notice(`Opened data-watch digest #${created.data.number}`);
            }

      - name: Enforce SLA freshness
        if: steps.sla.outcome == 'failure'
        shell: bash
        run: exit 1
