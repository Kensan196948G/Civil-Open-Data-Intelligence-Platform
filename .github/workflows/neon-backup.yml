name: Neon Backup

on:
  schedule:
    # Daily 03:17 JST. The job fails closed when required Secrets/Variables
    # are missing so backup drift becomes visible in Actions.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      history_window_hours:
        description: "Expected PITR window in hours. Recorded for drift detection only; the gate judges the value measured from the Neon API"
        required: false
        type: string
        default: "24"
      restore_drill_at:
        description: "Latest restore drill timestamp (ISO 8601)"
        required: false
        type: string
      restore_drill_status:
        # Intentionally has no default. A default here would recreate the
        # constant that made the restore drill gate unfailable, just one file
        # further out. An unrun drill must leave the run red, not green.
        description: "Outcome of that restore drill: success / failed / partial / not-run / blocked"
        required: false
        type: string
      restore_drill_record:
        description: "Non-secret reference to the committed drill record, e.g. docs/runbooks/restore-drill-record.md#2026-08-11"
        required: false
        type: string
      owner:
        description: "Backup evidence owner or role"
        required: false
        type: string
        default: "release-manager"

permissions:
  contents: read

concurrency:
  group: neon-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 失敗をIssueとして可視化するための最小権限。
    # permissions を明示すると未列挙の権限は none になるため、
    # 連続失敗の判定に使う run 履歴読み取り (actions:read) も併せて宣言する。
    # 外部通知先やそのSecretは追加しない
    # (通知先の追加・変更は人間承認事項 / CLAUDE.md §17 Approval PR 対象)。
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      # Dedicated read-only or least-privilege dump URL. Never echo this value.
      NEON_DATABASE_URL: ${{ secrets.CODIP_NEON_PGDUMP_DATABASE_URL }}
      CODIP_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.CODIP_NEON_BACKUP_ENCRYPTION_PASSPHRASE }}
      # Read-only Neon control-plane key. Needed because the PITR retention
      # window is a control-plane property and cannot be read over SQL.
      # Only ever consumed as an env var by the evidence tool; never echoed.
      NEON_API_KEY: ${{ secrets.CODIP_NEON_API_KEY }}
      CODIP_NEON_PROJECT_ID: ${{ vars.CODIP_NEON_PROJECT_ID }}
      CODIP_NEON_BRANCH: main
      CODIP_NEON_PGDUMP_HOST: ${{ vars.CODIP_NEON_PGDUMP_HOST }}
      CODIP_NEON_HISTORY_WINDOW_HOURS: ${{ github.event.inputs.history_window_hours || vars.CODIP_NEON_HISTORY_WINDOW_HOURS }}
      CODIP_LAST_RESTORE_DRILL_AT: ${{ github.event.inputs.restore_drill_at || vars.CODIP_LAST_RESTORE_DRILL_AT }}
      CODIP_LAST_RESTORE_DRILL_STATUS: ${{ github.event.inputs.restore_drill_status || vars.CODIP_LAST_RESTORE_DRILL_STATUS }}
      CODIP_LAST_RESTORE_DRILL_RECORD: ${{ github.event.inputs.restore_drill_record || vars.CODIP_LAST_RESTORE_DRILL_RECORD }}
      CODIP_BACKUP_OWNER: ${{ github.event.inputs.owner || vars.CODIP_BACKUP_OWNER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pg_dump client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_dump /usr/local/bin/pg_dump
          sudo ln -sf /usr/lib/postgresql/17/bin/pg_dumpall /usr/local/bin/pg_dumpall
          pg_dump --version

      - name: Validate backup inputs
        shell: bash
        run: |
          echo "::add-mask::$NEON_DATABASE_URL"
          echo "::add-mask::$CODIP_BACKUP_ENCRYPTION_PASSPHRASE"
          echo "::add-mask::$NEON_API_KEY"
          missing=()
          [ -n "${NEON_DATABASE_URL:-}" ] || missing+=("secrets.CODIP_NEON_PGDUMP_DATABASE_URL")
          [ -n "${CODIP_BACKUP_ENCRYPTION_PASSPHRASE:-}" ] || missing+=("secrets.CODIP_NEON_BACKUP_ENCRYPTION_PASSPHRASE")
          [ -n "${CODIP_NEON_PGDUMP_HOST:-}" ] || missing+=("vars.CODIP_NEON_PGDUMP_HOST")
          [ -n "${CODIP_LAST_RESTORE_DRILL_AT:-}" ] || missing+=("inputs.restore_drill_at or vars.CODIP_LAST_RESTORE_DRILL_AT")
          # The three below were previously absent from this list, and each one
          # had a default further downstream that quietly supplied the answer the
          # gate wanted to hear. Requiring them here is what makes the defaults
          # removable: an unset value now stops the run instead of being
          # synthesised into a passing value.
          [ -n "${CODIP_NEON_HISTORY_WINDOW_HOURS:-}" ] || missing+=("inputs.history_window_hours or vars.CODIP_NEON_HISTORY_WINDOW_HOURS")
          [ -n "${CODIP_LAST_RESTORE_DRILL_STATUS:-}" ] || missing+=("inputs.restore_drill_status or vars.CODIP_LAST_RESTORE_DRILL_STATUS")
          [ -n "${CODIP_LAST_RESTORE_DRILL_RECORD:-}" ] || missing+=("inputs.restore_drill_record or vars.CODIP_LAST_RESTORE_DRILL_RECORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required Neon backup configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          # Reported separately from the list above because the remediation is
          # different: this Secret must be registered by a human (CLAUDE.md §17)
          # and cannot be substituted by a declared value without making the
          # evidence gate self-attesting again.
          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error::secrets.CODIP_NEON_API_KEY is not registered. The PITR retention window must be measured from the Neon control plane; the gate will not accept a declared history_window_hours in its place. Register a project-scoped, read-only Neon API key for project $CODIP_NEON_PROJECT_ID."
            exit 1
          fi
          actual_host="$(node -e '
            const url = new URL(process.env.NEON_DATABASE_URL);
            if (url.protocol !== "postgresql:" && url.protocol !== "postgres:") process.exit(2);
            process.stdout.write(url.hostname);
          ')" || {
            echo "::error::CODIP_NEON_PGDUMP_DATABASE_URL is not a valid PostgreSQL URL"
            exit 1
          }
          if [ "$actual_host" != "$CODIP_NEON_PGDUMP_HOST" ]; then
            echo "::error::Neon pg_dump endpoint does not match vars.CODIP_NEON_PGDUMP_HOST"
            exit 1
          fi

      - name: Create Neon pg_dump artifact
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$NEON_DATABASE_URL"
          echo "::add-mask::$CODIP_BACKUP_ENCRYPTION_PASSPHRASE"
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup_dir="$RUNNER_TEMP/neon-backups"
          mkdir -p "$backup_dir"
          dump_path="$backup_dir/codip-neon-${stamp}.dump"
          encrypted_path="${dump_path}.gpg"
          artifact_name="codip-neon-pgdump-${stamp}.dump.gpg"
          pg_dump --format=custom --no-owner --no-privileges --file "$dump_path" "$NEON_DATABASE_URL"
          test -s "$dump_path"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$CODIP_BACKUP_ENCRYPTION_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "$encrypted_path" "$dump_path"
          test -s "$encrypted_path"
          shred -u "$dump_path" || rm -f "$dump_path"
          chmod 600 "$encrypted_path"
          {
            echo "artifact_path=$encrypted_path"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Create non-secret backup evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$NEON_API_KEY"
          project_id="${CODIP_NEON_PROJECT_ID:-falling-dawn-93620497}"
          branch="$CODIP_NEON_BRANCH"
          # Declared expectation only. The tool measures the real PITR window
          # from the Neon API and records this alongside it so that a stale
          # repository variable shows up as drift instead of passing the gate.
          # No :-24 fallback: that default used to synthesise exactly the
          # threshold value, so an unconfigured repository looked identical to a
          # correctly configured one. Validate backup inputs now requires it.
          history_window_hours="$CODIP_NEON_HISTORY_WINDOW_HOURS"
          owner="${CODIP_BACKUP_OWNER:-release-manager}"
          evidence_path="$RUNNER_TEMP/neon-backup-evidence.json"
          npm run --silent release:create-neon-backup-evidence -- \
            --project-id "$project_id" \
            --branch "$branch" \
            --endpoint-host "$CODIP_NEON_PGDUMP_HOST" \
            --history-window-hours "$history_window_hours" \
            --neon-api-key-env NEON_API_KEY \
            --pg-dump-file "${{ steps.dump.outputs.artifact_path }}" \
            --pg-dump-artifact "github-actions-artifact://${{ steps.dump.outputs.artifact_name }}" \
            --restore-drill-at "$CODIP_LAST_RESTORE_DRILL_AT" \
            --restore-drill-status "$CODIP_LAST_RESTORE_DRILL_STATUS" \
            --restore-drill-record "$CODIP_LAST_RESTORE_DRILL_RECORD" \
            --owner "$owner" \
            --pretty > "$evidence_path"
          npm run --silent release:check-neon-backup-evidence -- --evidence-file "$evidence_path"
          echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"

      - name: Upload pg_dump artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.dump.outputs.artifact_name }}
          path: ${{ steps.dump.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-secret backup evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neon-backup-evidence
          path: ${{ steps.evidence.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 30

      # バックアップは「失敗しても誰にも届かない」状態が最も危険である。
      # 2026-08-13〜08-20 の9日間、必須入力の欠落で毎日 fail-closed していたが、
      # 通知経路が無かったため誰も気づかなかった。fail-closed 自体は設計どおりの
      # 正しい挙動であり、欠けていたのは通知だけだった。
      - name: Report backup failure as an incident issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const WORKFLOW_FILE = "neon-backup.yml";
            const DEDUPE_LABEL = "backup-incident";
            const HISTORY_DEPTH = 10;
            const { owner, repo } = context.repo;

            // 連続失敗は GitHub の run 履歴を単一の真実として数える。
            // workflow 側に状態を持たせると、run がキャンセル/タイムアウトした際に
            // 書き込まれないまま次の run が読むため、状態が静かに腐敗する。
            // この履歴参照は補助情報にすぎず、取得できなくても起票は必ず行う (fail-open)。
            let consecutiveFailures = 1;
            let streakKnown = false;
            try {
              const { data: history } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: WORKFLOW_FILE,
                status: "completed",
                per_page: HISTORY_DEPTH,
              });
              for (const run of history.workflow_runs.filter((r) => r.id !== context.runId)) {
                if (run.conclusion !== "failure") break;
                consecutiveFailures += 1;
              }
              streakKnown = true;
            } catch (error) {
              core.warning(`Could not read run history; reporting without a streak count: ${error.message}`);
            }

            // 回数不明時は P1 へ倒さない (誤った P1 は当番の信頼を損なう)。
            const severity = streakKnown && consecutiveFailures >= 2 ? "P1" : "P2";

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: DEDUPE_LABEL,
                color: "b60205",
                description: "バックアップ失敗の自動起票（重複防止ラベル）",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "# バックアップ失敗（自動起票）",
              "",
              `- 重大度: **${severity}**`,
              `- 連続失敗: ${streakKnown ? `${consecutiveFailures} 回` : "不明（run履歴を取得できず）"}`,
              `- 検知日時 (UTC): ${new Date().toISOString()}`,
              `- 失敗した run: ${runUrl}`,
              "",
              "## 最初に確認すること",
              "",
              "1. 失敗 step が `Validate backup inputs` の場合、必須の Secrets / Variables が未登録である",
              "   （fail-closed は設計どおりの挙動。値の登録は人間の決裁事項）",
              "2. `docs/runbooks/database-deployment.md` のバックアップ節",
              "3. 直近で成功した run の artifact 保持期限（既定 14 日）。",
              "   **失効すると pg_dump による復旧手段が失われ、Neon PITR の保持窓のみになる**",
              "",
              "> このIssueは連続失敗のあいだ本文を更新する。復旧したら手動でクローズすること。",
            ].join("\n");
            const title = `[${severity}] Neon バックアップ失敗（連続 ${streakKnown ? consecutiveFailures : "?"} 回）`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: DEDUPE_LABEL,
              per_page: 1,
            });
            if (openIssues.length > 0) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: openIssues[0].number,
                title,
                body,
              });
              core.notice(`Updated backup incident #${openIssues[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: [DEDUPE_LABEL],
                body,
              });
              core.notice(`Opened backup incident #${created.data.number}`);
            }
