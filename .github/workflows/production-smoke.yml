name: Production Smoke

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      run_notification_test:
        description: "通知経路のみの受信テストを実行する（本番probeは通常どおり実行し、テスト専用incident Issueを起票する）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 失敗通知に必要な最小権限。permissions を明示すると未列挙の権限は none に
    # なるため、run履歴を読む actions:read を落とすと連続失敗判定が403で失敗する。
    # 外部通知先やそのSecretは追加しない
    # (通知先の追加・変更は人間承認事項 / CLAUDE.md §17 Approval PR 対象)。
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Probe production health and database readiness
        id: production-status
        continue-on-error: true
        shell: bash
        run: >-
          node scripts/tools/post-release-status.js
          --production-url https://odip.mirai-dx-platform.com
          --preview-url http://192.168.0.185:3100
          --strict-production
          --allow-preview-down
          --max-response-ms 5000
          --diagnosis-out production-diagnosis.json
          > production-status.md 2>&1

      - name: Publish run summary
        if: always()
        shell: bash
        run: cat production-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted monitoring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-status-${{ github.run_id }}
          path: production-status.md
          retention-days: 14

      - name: Enforce production readiness
        if: steps.production-status.outcome == 'failure'
        shell: bash
        run: exit 1

      # 失敗を「表明」するだけでなく「伝達」する経路。exit 1 だけではGitHub既定通知
      # (各ユーザーの個人設定依存) にしか届かず、リポジトリ設定として固定されない。
      # 通知受信テスト（workflow_dispatch の run_notification_test=true）では本番probeを
      # 落とさずにこのstepを直接発火させる。continue-on-errorの失敗は failure() を
      # 真にしないため、入力フラグをOR条件で明示する。
      - name: Report production smoke failure as an incident issue
        if: failure() || github.event.inputs.run_notification_test == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          # 通知テストか実障害かを、probeの実結果と組み合わせて判定する
          # （実障害中にテストdispatchが重なっても誤分類しない）。
          PROBE_OUTCOME: ${{ steps.production-status.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const WORKFLOW_FILE = "production-smoke.yml";
            const DEDUPE_LABEL = "production-smoke";
            // listWorkflowRuns の per_page 上限。1リクエストで遡れる範囲がそのまま
            // 連続失敗回数の観測窓になるため、上限まで使う (呼び出し回数は変わらない)。
            const HISTORY_DEPTH = 100;
            // 通知受信テスト（workflow_dispatch input）の場合は、実障害と区別できる
            // 別ラベル・タイトル接頭辞を使い、既存の実incidentへ追記しない。
            // probeが失敗している場合は実障害として扱う（テスト分類しない）。
            const isNotificationTest =
              String(context.payload?.inputs?.run_notification_test ?? "false") === "true" &&
              process.env.PROBE_OUTCOME === "success";
            const dedupeLabel = isNotificationTest ? "production-smoke-test" : DEDUPE_LABEL;
            const { owner, repo } = context.repo;

            // 通知テストは実障害の連続失敗判定に混ぜない。
            // 実障害の場合のみ、GitHubのrun履歴を単一の真実として連続失敗を数える (案B)。
            // workflow側に状態を持たせる案Aは、run がキャンセル/タイムアウトすると
            // 書き込まれないまま次のrunが読むため、状態が静かに腐敗する。
            //
            // この履歴参照は補助情報にすぎない。通知そのものが安全網なので、
            // 履歴が取れなくてもIssue起票は必ず行う (fail-open)。
            //
            // 観測窓は有限なので、窓内が全て失敗だった場合に得られるのは「連続失敗が
            // 何回だったか」ではなく「何回以上か」でしかない。この飽和を区別せずに
            // 確定値として書くと、60時間継続した障害が "11 consecutive" として記録され、
            // 当番は障害開始をおよそ3時間前と誤読する (Issue #207 で実際に発生)。
            let consecutiveFailures = isNotificationTest ? 1 : null;
            let streakSaturated = false;
            if (!isNotificationTest) {
              try {
                const { data: history } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: WORKFLOW_FILE,
                  status: "completed",
                  per_page: HISTORY_DEPTH,
                });
                // このstepは failure() でのみ動くので、現runは失敗として1から数える。
                consecutiveFailures = 1;
                const previousRuns = history.workflow_runs.filter((r) => r.id !== context.runId);
                let sawNonFailure = false;
                for (const run of previousRuns) {
                  if (run.conclusion !== "failure") {
                    sawNonFailure = true;
                    break;
                  }
                  consecutiveFailures += 1;
                }
                // 非失敗runに当たらないまま窓を使い切った = 実際の連続失敗はこれ以上。
                // 履歴が観測窓に満たない場合 (初回失敗・run総数が少ない) は、それ以上
                // 遡れる run が存在しないので数えた値が実数であり、飽和ではない。
                // ここを区別しないと「直近100runが全て失敗」を run 0件でも主張する。
                streakSaturated = history.workflow_runs.length >= HISTORY_DEPTH && !sawNonFailure;
              } catch (error) {
                core.warning(`Could not read run history; reporting without a streak count: ${error.message}`);
              }
            }

            // runbook §1 の異常判定「連続2回以上」に対応させる。
            // 回数不明時はP1へ倒さない (誤ったP1は当番の信頼を損なう)。
            const severity = isNotificationTest
              ? "P2"
              : consecutiveFailures !== null && consecutiveFailures >= 2
                ? "P1"
                : "P2";
            // タイトル・本文で共有する連続失敗の表記。飽和時は必ず「以上」を伴わせ、
            // 下限値であることを表記から落とさない。
            const streakText =
              consecutiveFailures === null ? "?" : `${consecutiveFailures}${streakSaturated ? "以上" : ""}`;
            const streakLabel =
              isNotificationTest
                ? "テスト（実障害なし）"
                : consecutiveFailures === null
                  ? "不明 (run履歴取得に失敗)"
                  : streakSaturated
                    ? `${streakText} (直近${HISTORY_DEPTH}runが全て失敗。実際の連続失敗はこれ以上)`
                    : `${streakText} (直近${HISTORY_DEPTH}run参照)`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // probeが確定させた診断結論を本文へ載せる。runへの参照だけを書いていた頃は、
            // 当番がIssueを開いても「何が壊れたか」が分からず、artifactを取得するまで
            // 原因へ辿り着けなかった (Issue #207 は352コメント積まれても未解決のままだった)。
            // 載せるのは post-release-status.js の buildIncidentDigest が返す非機密digestに限る。
            // probe出力そのもの (endpoint由来の文字列を含む) は従来どおり artifact 側に置く。
            const readDigest = () => {
              try {
                const parsed = JSON.parse(fs.readFileSync("production-diagnosis.json", "utf8"));
                return Array.isArray(parsed?.diagnosis) ? parsed : null;
              } catch (error) {
                // digestが無い/壊れていても通知は落とさない (fail-open)。
                core.warning(`Could not read the diagnosis digest; reporting without it: ${error.message}`);
                return null;
              }
            };
            const digest = readDigest();
            // digestの各セルはprobe側で改行除去・長さ上限済みだが、表を壊さないよう
            // パイプだけはこちらでもエスケープする。
            const cell = (value) => String(value ?? "").replace(/\|/g, "\\|");
            const diagnosisLines = digest
              ? [
                  "",
                  `**probeの診断** (Overall: ${cell(digest.overall)} / Access service token: ${
                    digest.accessTokenConfigured ? "configured" : "not configured"
                  })`,
                  "",
                  "| Check | State | Detail |",
                  "| --- | --- | --- |",
                  ...digest.diagnosis.map((row) => `| ${cell(row.check)} | ${cell(row.state)} | ${cell(row.detail)} |`),
                  "",
                  `本番probeの応答: ${
                    (digest.productionStatuses ?? [])
                      .map((probe) => `\`${cell(probe.path)}\` → ${Number(probe.status) || "no response"}`)
                      .join(" / ") || "(なし)"
                  }`,
                ]
              : [];

            const body = [
              `${isNotificationTest ? "【通知受信テスト】" : ""}production smoke (\`${WORKFLOW_FILE}\`) が失敗しました。`,
              "",
              `| 項目 | 値 |`,
              `| --- | --- |`,
              `| 種別 | ${isNotificationTest ? "通知受信テスト（dispatch専用・実障害ではない）" : "実障害" } |`,
              `| 重大度 | ${severity} |`,
              `| 連続失敗回数 | ${streakLabel} |`,
              `| 失敗run | ${runUrl} |`,
              `| 検知時刻 (UTC) | ${new Date().toISOString()} |`,
              "",
              isNotificationTest
                ? "これは workflow_dispatch の通知テストで生成されたIssueです。受信確認後にクローズしてください（docs/runbooks/notification-test-record.md）。"
                : severity === "P1"
                ? "連続2回以上の失敗のため **P1**。`docs/runbooks/monitoring.md` §1.1 の初動 (15分以内) に従ってください。"
                : consecutiveFailures === null
                  ? "連続失敗回数を判定できなかったため P2 として起票しています。run履歴を目視で確認してください。"
                  : "初回失敗のため P2。次runも失敗した場合は自動でP1へ昇格します。",
              ...diagnosisLines,
              "",
              "詳細は run の Summary と `production-status` artifact (14日保持) を参照してください。",
            ].join("\n");

            // 起票に使うlabelがリポジトリへ未登録でも通知を落とさないよう、
            // 事前に冪等作成する (既存なら422を無視)。labelの事前手動登録という
            // 外部依存を残すと、忘れた時に気づくのが障害発生時になる。
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            };
            await ensureLabel("incident", "b60205", "本番障害。runbookの初動対象");
            await ensureLabel(
              dedupeLabel,
              isNotificationTest ? "e4e669" : "d93f0b",
              isNotificationTest
                ? "通知受信テスト用（workflow_dispatch専用）"
                : "production smoke workflowが自動起票したincident",
            );
            await ensureLabel(severity, severity === "P1" ? "b60205" : "fbca04", `重大度 ${severity}`);

            // タイトルは起票時点の観測ではなく「最新の観測」を表す。追記運用では
            // 本文は最新でもタイトルが初回のまま凍結され、Issue一覧を見る当番には
            // 継続中の障害が初回失敗のまま見える (Issue #207 は60時間経過後も
            // "[P2] production smoke failure (1 consecutive)" のままだった)。
            const incidentTitle = `${isNotificationTest ? "[TEST] " : ""}[${severity}] production smoke failure (${streakText} consecutive)`;

            // 15分間隔のprobeが継続失敗するとrun毎にIssueが増えるため、
            // 未クローズのincidentがあればコメント追記に寄せる。
            const { data: openIncidents } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: dedupeLabel,
              per_page: 1,
            });

            if (openIncidents.length > 0) {
              const incident = openIncidents[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body,
              });
              const labels = incident.labels.map((l) => (typeof l === "string" ? l : l.name));
              if (severity === "P1" && !labels.includes("P1")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: incident.number,
                  labels: ["P1"],
                });
              }
              if (incident.title !== incidentTitle) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: incident.number,
                  title: incidentTitle,
                });
              }
              core.notice(`Appended to incident #${incident.number} (${severity}, streak=${streakText})`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title: incidentTitle,
              labels: ["incident", severity, dedupeLabel],
              body,
            });
            core.notice(`Opened incident #${created.number} (${severity}, streak=${streakText})`);
