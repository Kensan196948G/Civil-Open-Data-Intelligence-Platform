name: Production Smoke

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 失敗通知に必要な最小権限。permissions を明示すると未列挙の権限は none に
    # なるため、run履歴を読む actions:read を落とすと連続失敗判定が403で失敗する。
    # 外部通知先やそのSecretは追加しない
    # (通知先の追加・変更は人間承認事項 / CLAUDE.md §17 Approval PR 対象)。
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Probe production health and database readiness
        id: production-status
        continue-on-error: true
        shell: bash
        run: >-
          node scripts/tools/post-release-status.js
          --production-url https://odip.mirai-dx-platform.com
          --preview-url http://192.168.0.185:3100
          --strict-production
          --allow-preview-down
          --max-response-ms 5000
          > production-status.md 2>&1

      - name: Publish run summary
        if: always()
        shell: bash
        run: cat production-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted monitoring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-status-${{ github.run_id }}
          path: production-status.md
          retention-days: 14

      - name: Enforce production readiness
        if: steps.production-status.outcome == 'failure'
        shell: bash
        run: exit 1

      # 失敗を「表明」するだけでなく「伝達」する経路。exit 1 だけではGitHub既定通知
      # (各ユーザーの個人設定依存) にしか届かず、リポジトリ設定として固定されない。
      - name: Report production smoke failure as an incident issue
        # 素の failure() だと、probe成功後のartifact upload障害でも「production
        # smokeが失敗」というincidentを起票する。運用記録に偽の事実が残る。
        #
        # 逆に outcome == 'failure' へ絞ると、checkout/setup-node が落ちて probe が
        # 一度も走らなかったrun (outcome は空文字) で無通知になる。監視が静かに
        # 実行されない状態はIssue #90そのものなので、そちらを落としてはならない。
        # != 'success' は「失敗」と「未実行」を拾い、「成功後の後続step障害」だけを除く。
        if: failure() && steps.production-status.outcome != 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PROBE_OUTCOME: ${{ steps.production-status.outcome }}
        with:
          script: |
            const WORKFLOW_FILE = "production-smoke.yml";
            const DEDUPE_LABEL = "production-smoke";
            const HISTORY_DEPTH = 10;
            const { owner, repo } = context.repo;

            // 連続失敗の判定はGitHubのrun履歴を単一の真実とする (案B)。
            // workflow側に状態を持たせる案Aは、run がキャンセル/タイムアウトすると
            // 書き込まれないまま次のrunが読むため、状態が静かに腐敗する。
            //
            // この履歴参照は補助情報にすぎない。通知そのものが安全網なので、
            // 履歴が取れなくてもIssue起票は必ず行う (fail-open)。
            let consecutiveFailures = null;
            try {
              const { data: history } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: WORKFLOW_FILE,
                status: "completed",
                // status:"completed" は実行中の現runを含まない。現runを1として数える
                // ので過去分は HISTORY_DEPTH-1 件で、合計がちょうど HISTORY_DEPTH run。
                // per_page: HISTORY_DEPTH にすると上限が11になり、本文の
                // 「直近N run参照」という自己申告と実際の参照範囲がずれる。
                per_page: HISTORY_DEPTH - 1,
              });
              // このstepは failure() でのみ動くので、現runは失敗として1から数える。
              consecutiveFailures = 1;
              for (const run of history.workflow_runs.filter((r) => r.id !== context.runId)) {
                if (run.conclusion !== "failure") break;
                consecutiveFailures += 1;
              }
            } catch (error) {
              core.warning(`Could not read run history; reporting without a streak count: ${error.message}`);
            }

            // runbook §1 の異常判定「連続2回以上」に対応させる。
            // 回数不明時はP1へ倒さない (誤ったP1は当番の信頼を損なう)。
            const severity = consecutiveFailures !== null && consecutiveFailures >= 2 ? "P1" : "P2";
            const streakLabel =
              consecutiveFailures === null ? "不明 (run履歴取得に失敗)" : `${consecutiveFailures} (直近${HISTORY_DEPTH}run参照)`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // probeが落ちたのか、probeまで到達しなかったのかを区別する。前者は本番の
            // 異常、後者は監視自体が動かなかったという別の事象で、初動が異なる。
            const probeFailed = process.env.PROBE_OUTCOME === "failure";
            const headline = probeFailed
              ? `production smoke (\`${WORKFLOW_FILE}\`) が失敗しました。`
              : `production smoke (\`${WORKFLOW_FILE}\`) が **probeへ到達せずに終了** しました`
                + `(\`production-status\` outcome=\`${process.env.PROBE_OUTCOME || "未実行"}\`)。`
                + `本番の状態は**判定できていません**。`;

            // 本文にはrunへの参照だけを書く。probe出力は redacted artifact 側に置き、
            // Secret / 認証情報 / PII をIssueへ持ち込まない。
            const body = [
              headline,
              "",
              `| 項目 | 値 |`,
              `| --- | --- |`,
              `| 重大度 | ${severity} |`,
              `| 連続失敗回数 | ${streakLabel} |`,
              `| 失敗run | ${runUrl} |`,
              `| 検知時刻 (UTC) | ${new Date().toISOString()} |`,
              "",
              severity === "P1"
                ? "連続2回以上の失敗のため **P1**。`docs/runbooks/monitoring.md` §1.1 の初動 (15分以内) に従ってください。"
                : consecutiveFailures === null
                  ? "連続失敗回数を判定できなかったため P2 として起票しています。run履歴を目視で確認してください。"
                  : "初回失敗のため P2。次runも失敗した場合は自動でP1へ昇格します。",
              "",
              "詳細は run の Summary と `production-status` artifact (14日保持) を参照してください。",
            ].join("\n");

            // 起票に使うlabelがリポジトリへ未登録でも通知を落とさないよう、
            // 事前に冪等作成する (既存なら422を無視)。labelの事前手動登録という
            // 外部依存を残すと、忘れた時に気づくのが障害発生時になる。
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            };
            await ensureLabel("incident", "b60205", "本番障害。runbookの初動対象");
            await ensureLabel(DEDUPE_LABEL, "d93f0b", "production smoke workflowが自動起票したincident");
            await ensureLabel(severity, severity === "P1" ? "b60205" : "fbca04", `重大度 ${severity}`);

            // 15分間隔のprobeが継続失敗するとrun毎にIssueが増えるため、
            // 未クローズのincidentがあればコメント追記に寄せる。
            //
            // issues.listForRepo はPull Requestも返す。DEDUPE_LABEL の付いたPRが
            // 先頭に来ると、そのPRへコメントして return し、incidentが起票されない。
            // 通知が静かに消えるので、pull_request を持つ要素は必ず除外する。
            // per_page を1に絞ると除外後に候補が残らないため、余裕を持って取得する。
            const { data: openItems } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: DEDUPE_LABEL,
              per_page: 30,
            });
            const openIncidents = openItems.filter((item) => !item.pull_request);

            if (openIncidents.length > 0) {
              const incident = openIncidents[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: incident.number,
                body,
              });
              const labels = incident.labels.map((l) => (typeof l === "string" ? l : l.name));
              if (severity === "P1" && !labels.includes("P1")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: incident.number,
                  labels: ["P1"],
                });
              }
              core.notice(`Appended to incident #${incident.number} (${severity}, streak=${consecutiveFailures ?? "unknown"})`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title: probeFailed
                ? `[${severity}] production smoke failure (${consecutiveFailures ?? "?"} consecutive)`
                : `[${severity}] production smoke did not reach the probe (${consecutiveFailures ?? "?"} consecutive)`,
              labels: ["incident", severity, DEDUPE_LABEL],
              body,
            });
            core.notice(`Opened incident #${created.number} (${severity}, streak=${consecutiveFailures ?? "unknown"})`);
